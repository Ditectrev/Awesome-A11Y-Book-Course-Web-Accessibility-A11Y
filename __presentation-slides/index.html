```html[|1|2|29|2,29|3|13|3,13|5|15|16|20|16,20|17|19|17,19|21|23|21,23|24|27|24,27|25]
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Definition and scope of web accessibility</title>
    <style>
      /* Demo only: push main below the fold so the skip link scroll is visible */
      section[aria-label="Site banner"] {
        min-height: 600px;
        background: #f3f4f6;
      }
    </style>
  </head>
  <body>
    <a href="#main">Skip to main content</a>
    <header>
      <nav aria-label="Primary">
        <a href="/">Home</a>
      </nav>
    </header>
    <section aria-label="Site banner">
      <!-- repeated content on every page -->
    </section>
    <main id="main">
      <h1>Shipping address</h1>
      <!-- primary content -->
    </main>
  </body>
</html>
```

### WCAG 2.1 / 2.2 and the POUR principles <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

### POUR principles <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Perceptible: The content is presented in a way that is perceivable to the user. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Operable: The content is operable by the user. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Robust: The content is robust enough that it can be used by a wide range of users. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Understandable: The content is understandable by the user. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Consistent navigation and identification (3.2.3, 3.2.4) <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Keep repeated navigation mechanisms in the same relative order across pages. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Use the same label for the same destination (`Support` should not become `Help Center` randomly). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Keep icon + text combinations consistent for recurrent actions. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Reuse component behavior patterns (same menu opens the same way everywhere). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---
### Change on request and common pitfalls <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Auto-redirecting users after a short timer without warning or extension options. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Opening external links in a new tab without visible notice. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Triggering route changes from `onchange` handlers in forms. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Re-rendering large sections on blur/focus in ways that steal focus. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## HTML Semantics and ARIA <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---
### When to use native HTML vs ARIA <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---
### Add ARIA only when native HTML cannot express intent <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* You need to expose relationships (`aria-controls`, `aria-labelledby`, `aria-describedby`). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A custom widget must communicate state (`aria-expanded`, `aria-selected`, `aria-checked`). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* You are implementing a recognized composite pattern (tabs, listbox, combobox, menu button) and can match the full keyboard behavior. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---
### ARIA roles, states, and properties <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---
### Role defines what a component is <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Use role values from the WAI-ARIA spec only (`button`, `tab`, `dialog`, `alert`, `status`). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Keep role and interaction model aligned (for example, a `tab` must support roving focus and selected state). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Prefer implicit native roles before explicit role attributes. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---
### States/properties define current condition and relationships <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

```html[|1-3|4-6|7-9|10-12|13-15|16|17|18|19|20]
    <h1>Filter panel</h1>
    <p>
      <code>aria-expanded</code> and <code>aria-controls</code> expose the
      relationship between the button and the collapsible panel.
    </p>

    <button
      id="filters-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="filters-panel"
    >
      Filters
    </button>

    <section id="filters-panel" hidden>
      <h2>Filter products</h2>
      <label><input type="checkbox" name="in-stock" /> In stock only</label>
      <label><input type="checkbox" name="sale" /> On sale</label>
    </section>
```

[![Edit 057-States/properties define current condition and relationships](images/codesandbox.svg)](https://codesandbox.io/p/sandbox/057-states-properties-define-current-condition-and-relationships-m722hw)

[CodeSandbox: States/properties define current condition and relationships](https://m722hw.csb.app/).

---
### Tabs (roving focus, selected panel) <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---
### Tabs: roving focus plus selected panel mapping <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Use `role="tablist"` on the container, `role="tab"` on each trigger, and `role="tabpanel"` on each panel. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Connect tabs and panels with `aria-controls` and `aria-labelledby`. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Track selection with `aria-selected` and `tabindex` (selected tab `0`, others `-1`). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Support Arrow keys to move between tabs and Enter/Space to activate when needed. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---
### Menus, combobox, listbox, disclosure <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---
### Choose the right pattern for the interaction <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Use **disclosure** (button + expandable region) for show/hide content sections. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Use **menu button/menu** for application-style command lists with strict arrow-key navigation. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Use **listbox** for selecting one or many options from a list. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Use **combobox** for editable/selectable inputs that reveal suggestions. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---
### Disclosure as a safer default for many dropdown-like UIs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

```html[|1-3|4-6|7-9|10-12|13|14|15]
    <h1>Account menu</h1>
    <p>
      For simple dropdowns like this, use native disclosure with
      <code>&lt;details&gt;</code> and <code>&lt;summary&gt;</code> — not
      <code>role="menu"</code>. It opens and closes with no JavaScript.
    </p>

    <details>
      <summary>Account options</summary>
      <div class="account-links">
        <a href="/profile">Profile</a>
        <a href="/billing">Billing</a>
        <button type="button">Sign out</button>
      </div>
    </details>
```

## Testing and Evaluation <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---
### Manual testing: keyboard and screen readers <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---
### Keyboard testing procedure: tab through, Enter/Space, Escape <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Start at the browser address bar, then use `Tab` to enter the page and move forward through all controls. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Use `Shift+Tab` to verify reverse navigation order is logical. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Activate controls with `Enter` and `Space` (buttons, links, checkboxes, toggles, menu triggers). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Use arrow keys where expected (radio groups, tabs, listbox options, menus). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Use `Escape` to close overlays such as dialogs, popovers, and dropdowns. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Confirm focus remains visible at all times and never disappears behind styling resets. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---
### Screen reader testing (NVDA, VoiceOver), browse mode vs focus mode <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Test at least one Windows + NVDA flow and one macOS + VoiceOver flow when possible. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Check headings, landmarks, and links list/rotor to confirm page structure. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Navigate in **browse/virtual mode** for reading flow and semantic structure. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Switch to **focus/forms mode** when operating form fields and widgets. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---
### Automated testing: axe, WAVE, Lighthouse <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---
### axe-core and browser extensions, Lighthouse a11y score <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* **axe DevTools / axe-core**: robust rule set, useful in-browser and test automation. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **WAVE**: fast visual overlay for missing labels, contrast warnings, and landmark issues. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Lighthouse**: broad health signal and trend metric for accessibility improvements over time. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---
### Interpreting results, limitations of automation, false positives/negatives <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Automated tools cannot reliably judge link purpose in context, writing clarity, or meaningful alt text quality. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Keyboard behavior defects (focus trap logic, roving index bugs) are often missed. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Screen reader announcement quality and timing issues are mostly manual-test findings. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

import { render } from '@testing-library/react';
import { axe, toHaveNoViolations } from 'jest-axe';
import LoginForm from './LoginForm';

expect.extend(toHaveNoViolations);

### Reporting issues and prioritization <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---
### Severity and impact, steps to reproduce and WCAG criterion <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* **User impact:** who is affected (keyboard-only users, screen reader users, low-vision users). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Severity:** blocker/critical/high/medium/low based on task interruption and workaround availability. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Steps to reproduce:** exact path, environment, input method, and expected vs actual result. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Standards mapping:** related WCAG criterion (for example `1.3.1`, `2.1.1`, `4.1.2`) and internal policy if applicable. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Evidence:** screenshots, short recordings, DOM snippet, and tool output if available. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## Appendix A: Quick Reference (WCAG 2.x) <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---
### Perceivable, Operable, Understandable, Robust quick list <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---
### Fast mental model and implementation checkpoints <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* **Perceivable:** users can detect content regardless of sense used (text alternatives, captions, adaptable structure, sufficient contrast). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Operable:** users can interact with all controls and flows (keyboard access, enough time, no seizure triggers, clear navigation). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Understandable:** users can read and predict behavior (plain language, consistent navigation, clear instructions and error handling). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Robust:** content works across browsers, assistive technologies, and future agents (valid semantics, correct name/role/value, resilient patterns). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## Appendix B: Glossary <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---
### Key terms (accessible name, landmark, live region, etc.) <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---
### Practical vocabulary used in audits, design reviews, and implementation <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* **Accessible name:** the spoken label assistive technologies use for an element (from visible text, `aria-label`, `aria-labelledby`, alt text, etc.). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Accessible description:** supplemental context announced with the accessible name, often from `aria-describedby`. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Alternative text (alt text):** text alternative for meaningful images that communicates purpose or information. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **ARIA (Accessible Rich Internet Applications):** attributes that expose semantics/state when native HTML alone is insufficient. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Assistive technology (AT):** software/hardware used by disabled users to interact with content (screen readers, switch devices, magnifiers, voice input). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Color contrast ratio:** luminance difference between foreground and background; critical for text and non-text UI visibility. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Focus indicator:** visible cue showing which element currently receives keyboard interaction. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Focus order:** sequence keyboard users move through interactive elements; should follow logical reading/task order. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---
### Acronyms and abbreviations <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---
### Common shorthand in accessibility documentation and issue tracking <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* **A11Y:** numeronym for accessibility. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **ACR:** Accessibility Conformance Report. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **AT:** Assistive Technology. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **ARIA:** Accessible Rich Internet Applications. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **DOM:** Document Object Model. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **EAA:** European Accessibility Act. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **EN 301 549:** European ICT accessibility standard used in procurement/compliance contexts. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **HCM:** High Contrast Mode. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Practical toolkit for automated checks and manual verification <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* **Browser DevTools accessibility panes:** inspect roles, names, contrast, heading order, landmarks, and computed accessibility tree. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **axe DevTools / axe-core:** fast automated scans for common failures (missing labels, contrast failures, ARIA misuse, landmark gaps). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **WAVE:** visual page overlays that help spot structural and labeling issues quickly during review. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Lighthouse accessibility audit:** high-level baseline checks integrated with Chrome workflows and CI reporting. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Keyboard-only test pass:** verify focus visibility, focus order, skip links, modal traps, and full task completion without a mouse. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Screen readers to include in testing matrix:** NVDA (Windows), JAWS (Windows), VoiceOver (macOS/iOS), TalkBack (Android). <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
